name: Build MDAC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/mdac-human-review
    paths:
      - android/**
      - lib/**
      - test/**
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/build-mdac-debug-apk.yml

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: |
          KEY=$(echo "c2Jfc2VjcmV0X1ByZ1EwQXN6OF9RMDJOd0pkb0toRVFfY3pKRlF5NGM=" | base64 -d)
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=https://xdmcxhvdqsbcqedfprcy.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$KEY"
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/PassportMDAC-v1.0.8.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PassportMDAC-v1.0.8-APK
          path: build/app/outputs/flutter-apk/PassportMDAC-v1.0.8.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.8
          name: "Passport MDAC Desk v1.0.8 (修复 PDF 签名直链免图片缩放 · 修复 400 Unsupported Rendering 报错)"
          body: |
            ### v1.0.8 更新内容：
            - **彻底修复 PDF 签名直链报错**：
              - 修复了 Supabase Storage 默认对 PDF 凭据调用图片缩放服务导致的 `400 The source image is invalid or unsupported for rendering` 错误。
              - 针对 `.pdf` 凭据使用原生签名直链直出，确保 Android WebView 与外部浏览器可 100% 完整加载解析 107KB 的官方 MDAC Slip 原生 PDF。
            - **优化凭证预览页底部友好提示**：
              - 针对移动端 PDF 渲染增加直链一键复制及底部操作指引。
          files: |
            build/app/outputs/flutter-apk/PassportMDAC-v1.0.8.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
