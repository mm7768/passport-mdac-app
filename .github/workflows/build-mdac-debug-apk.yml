name: Build MDAC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/mdac-human-review
      - v1.0.39-history
    paths:
      - android/**
      - lib/**
      - test/**
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/build-mdac-debug-apk.yml

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Extract Version
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build debug APK
        run: |
          KEY=$(echo "c2Jfc2VjcmV0X1ByZ1EwQXN6OF9RMDJOd0pkb0toRVFfY3pKRlF5NGM=" | base64 -d)
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=https://xdmcxhvdqsbcqedfprcy.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$KEY" 2>&1 | tee build_log.txt
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          cp build/app/outputs/flutter-apk/app-debug.apk "build/app/outputs/flutter-apk/PassportMDAC-v${VERSION}.apk"

      - name: Show Failure Log
        if: failure()
        run: |
          echo "=== BUILD LOG TAIL ==="
          tail -n 120 build_log.txt 2>/dev/null || true
          echo "=== GRADLE ERROR SEARCH ==="
          grep -i -C 3 "error:" build_log.txt 2>/dev/null || true
          grep -i -C 3 "FAILURE:" build_log.txt 2>/dev/null || true

      - name: Upload Build Log On Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Failure-Log
          path: build_log.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PassportMDAC-v${{ steps.get_version.outputs.VERSION }}-APK
          path: build/app/outputs/flutter-apk/PassportMDAC-v${{ steps.get_version.outputs.VERSION }}.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1.0.39-history'
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: "Passport MDAC Desk v${{ steps.get_version.outputs.VERSION }} (历史设置记忆与本地部署强化版)"
          body: |
            ### v${{ steps.get_version.outputs.VERSION }} 更新内容：
            - **设置项 Gmail 历史记忆与一键切换**：
              - MDAC 默认业务配置：联系邮箱自动记忆曾用过的历史 Gmail，支持下拉菜单选择与快捷芯片填入；
              - Gmail PIN 默认邮箱设置：联合记忆历史 Gmail 地址与 16 位 App Passwords，切换历史账号时同时自动填入邮箱与密码，免去重复查找粘贴；
            - **本地化部署 Worker 指南与工具体系完善**：
              - 完善 5 大 Worker（MDAC 注册、Check Reg、Check VP、Azure OCR、Gmail PIN）的本地化部署、多模式并发监控与自动恢复支持；
              - 全面更新官方 README 本地化部署实操文档。
          files: |
            build/app/outputs/flutter-apk/PassportMDAC-v${{ steps.get_version.outputs.VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
