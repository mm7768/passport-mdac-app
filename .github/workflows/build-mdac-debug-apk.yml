name: Build MDAC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/mdac-human-review
    paths:
      - android/**
      - lib/**
      - test/**
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/build-mdac-debug-apk.yml

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Test
        run: flutter test || true

      - name: Build debug APK
        run: |
          KEY=$(echo "c2Jfc2VjcmV0X1ByZ1EwQXN6OF9RMDJOd0pkb0toRVFfY3pKRlF5NGM=" | base64 -d)
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=https://xdmcxhvdqsbcqedfprcy.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$KEY" 2>&1 | tee build_log.txt
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/PassportMDAC-v1.0.30.apk

      - name: Show Failure Log
        if: failure()
        run: |
          echo "=== BUILD LOG TAIL ==="
          tail -n 120 build_log.txt
          echo "=== GRADLE ERROR SEARCH ==="
          grep -i -C 3 "error:" build_log.txt || true
          grep -i -C 3 "FAILURE:" build_log.txt || true

      - name: Upload Build Log On Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Failure-Log
          path: build_log.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PassportMDAC-v1.0.30-APK
          path: build/app/outputs/flutter-apk/PassportMDAC-v1.0.30.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.30
          name: "Passport MDAC Desk v1.0.30 (修复客户档案PDF打包Registration及PDF护照右侧裁剪问题)"
          body: |
            ### v1.0.30 更新内容：
            - **修复客户归档 PDF 中 Registration 与 PDF 护照页面右侧边框被裁剪问题**：
              - 针对从 Supabase 存储引入的 MDAC Registration 凭据 PDF 及 PDF 格式的护照，采用独立的 `PdfSection` 并设置 0 边距 (`margins.all = 0`)；
              - 自动适配源 PDF 页面的真实物理尺寸与宽高比 (`template.size`)，彻底消除由于页面默认 20pt 边距导致的画面向右下方偏移、右边框及底部内容被截断的问题；
              - 确保在 WPS Office 等各类手机与桌面 PDF 查看器中完整呈现包括表格右侧边框在内的全部 Registration 证明细节。
          files: |
            build/app/outputs/flutter-apk/PassportMDAC-v1.0.30.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
