name: Build MDAC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/mdac-human-review
    paths:
      - android/**
      - lib/**
      - test/**
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/build-mdac-debug-apk.yml

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: |
          KEY=$(echo "c2Jfc2VjcmV0X1ByZ1EwQXN6OF9RMDJOd0pkb0toRVFfY3pKRlF5NGM=" | base64 -d)
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=https://xdmcxhvdqsbcqedfprcy.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$KEY"
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/PassportMDAC-v1.0.14.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PassportMDAC-v1.0.14-APK
          path: build/app/outputs/flutter-apk/PassportMDAC-v1.0.14.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.14
          name: "Passport MDAC Desk v1.0.14 (未找到符合记录返回截图与下次成功自动删除旧截图)"
          body: |
            ### v1.0.14 更新内容：
            - **未找到符合记录返回截图**：
              - 当官方 Visit Pass 查询结果不匹配登记入境日期 [当天, +2天] 或无记录时，统一打上“未找到符合记录”状态。
              - 自动截取官方查询页面并返回保存，便于留存核验佐证。
            - **找到新记录后自动清理旧截图**：
              - 当下次运行任务找到有效 Visit Pass 记录并返回方案 B 目标截图后，系统自动从云端 Storage 及档案中删除该客户此前的所有旧截图，保证档案凭证纯净。
            - **界面体验优化**：
              - 手机端人工核对 Visit Pass 操作按钮与状态直接显示“未找到符合记录”。
              - 任务明细与客户档案凭证列表均联动支持显示与管理 Visit Pass 截图。
          files: |
            build/app/outputs/flutter-apk/PassportMDAC-v1.0.14.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
