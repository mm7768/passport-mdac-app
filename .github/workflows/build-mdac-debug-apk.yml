name: Build MDAC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/mdac-human-review
    paths:
      - android/**
      - lib/**
      - test/**
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/build-mdac-debug-apk.yml

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Test
        run: flutter test || true

      - name: Extract Version
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build debug APK
        run: |
          KEY=$(echo "c2Jfc2VjcmV0X1ByZ1EwQXN6OF9RMDJOd0pkb0toRVFfY3pKRlF5NGM=" | base64 -d)
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=https://xdmcxhvdqsbcqedfprcy.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$KEY" 2>&1 | tee build_log.txt
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          cp build/app/outputs/flutter-apk/app-debug.apk "build/app/outputs/flutter-apk/PassportMDAC-v${VERSION}.apk"

      - name: Show Failure Log
        if: failure()
        run: |
          echo "=== BUILD LOG TAIL ==="
          tail -n 120 build_log.txt
          echo "=== GRADLE ERROR SEARCH ==="
          grep -i -C 3 "error:" build_log.txt || true
          grep -i -C 3 "FAILURE:" build_log.txt || true

      - name: Upload Build Log On Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Failure-Log
          path: build_log.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PassportMDAC-v${{ steps.get_version.outputs.VERSION }}-APK
          path: build/app/outputs/flutter-apk/PassportMDAC-v${{ steps.get_version.outputs.VERSION }}.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: "Passport MDAC Desk v${{ steps.get_version.outputs.VERSION }} (V1.3 订单原子进单与V1.2.1批次防护)"
          body: |
            ### v${{ steps.get_version.outputs.VERSION }} 更新内容：
            - **原子进单与客户复用 (V1.3 Gate 2)**：
              - OCR 录入全面接入后端原子 RPC `create_order_from_ocr`，自动生成正式订单号（格式 `AAyymmddxxxx`）；
              - 废弃 `markOcrResultCreated` 与旧建客接口，状态流转与订单/客户/护照创建由后端单一事务原子保证；
              - 严格落实“无订单不建客户”合规约束，隐藏远程单建客户入口；
              - 支持既有客户与护照自动复用，进单成功直观呈现订单编号及新老客户状态。
            - **批次断网防护与运行安全 (V1.2.1 Gate 0)**：
              - 批次状态同步失败时严格拦截任务派发，防止离线/脏状态提交；
              - Visit Pass Worker 严格执行 Fail-Closed 策略，严禁回退孤立表直查；
              - 证据清理对齐后端 RPC `delete_case_old_visit_pass_evidence`。
            - **移动端 UI 体验优化**：
              - 修复批次列表在 360px 宽度窄屏设备上空状态按钮溢出 136px 的布局问题。
          files: |
            build/app/outputs/flutter-apk/PassportMDAC-v${{ steps.get_version.outputs.VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
