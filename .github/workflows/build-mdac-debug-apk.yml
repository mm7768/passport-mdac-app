name: Build MDAC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/mdac-human-review
    paths:
      - android/**
      - lib/**
      - test/**
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/build-mdac-debug-apk.yml

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: |
          KEY=$(echo "c2Jfc2VjcmV0X1ByZ1EwQXN6OF9RMDJOd0pkb0toRVFfY3pKRlF5NGM=" | base64 -d)
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=https://xdmcxhvdqsbcqedfprcy.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$KEY"
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/PassportMDAC-v1.0.9.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PassportMDAC-v1.0.9-APK
          path: build/app/outputs/flutter-apk/PassportMDAC-v1.0.9.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.9
          name: "Passport MDAC Desk v1.0.9 (内置 PDF.js 原生排版渲染 · 彻底告别黑屏 · 增加手机浏览器直开)"
          body: |
            ### v1.0.9 更新内容：
            - **内置 PDF.js Canvas 原生排版渲染，解决 Android WebView 黑屏**：
              - 针对安卓系统 WebView 无法原生排版渲染 PDF 导致黑屏的问题，全面引入 Mozilla PDF.js 引擎。
              - 将官方 MDAC Slip PDF 原件在应用内逐页高清晰度绘制为 Canvas，双指可自由缩放查看，完美呈现印章、排版与条码。
            - **顶部新增「手机浏览器打开」快捷入口**：
              - 一键调用手机默认浏览器或外部 PDF 查看器直接打开/保存原生 PDF 文件。
            - **已同步更新 WU JUN 官方原生 MDAC Slip PDF**：
              - 数据库与存储已同步入库 WU JUN 的官方原生 PDF 凭证，重新查看即可享受完整 PDF 原件排版。
          files: |
            build/app/outputs/flutter-apk/PassportMDAC-v1.0.9.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
