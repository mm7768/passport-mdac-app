name: Build MDAC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/mdac-human-review
    paths:
      - android/**
      - lib/**
      - test/**
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/build-mdac-debug-apk.yml

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: |
          KEY=$(echo "c2Jfc2VjcmV0X1ByZ1EwQXN6OF9RMDJOd0pkb0toRVFfY3pKRlF5NGM=" | base64 -d)
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=https://xdmcxhvdqsbcqedfprcy.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$KEY"
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/PassportMDAC-v1.0.6.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PassportMDAC-v1.0.6-APK
          path: build/app/outputs/flutter-apk/PassportMDAC-v1.0.6.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.6
          name: "Passport MDAC Desk v1.0.6 (任务明细与具体失败原因透出 · 待确认人工核验介入口 · 一键重试排队 · 拦截云端抢单)"
          body: |
            ### v1.0.6 更新内容：
            - **透出客户明细与具体失败原因**：
              - 点击批次卡片或详情，清晰列出批次内每位客户的姓名、护照号、独立状态标签。
              - 直观展示官方返回的具体原因（如：官方页面加载超时、官方查无记录、PIN码无效、日期不一致、滑块验证未通过等），不再显示模糊的“失败”。
            - **待确认/未成功客户人工核验介入口**：
              - 任务卡片新增「✋ 人工介入处理 / 查看明细与待核验项」入口（覆盖 Registration 与 Visit Pass）。
              - 针对超时未识别或需复核的客户，每行均提供「人工核验 / 滑块」按钮，一键调出官方验证页，自动带入客户凭据并由操作员核验或拖动滑块。
            - **一键重新自动排队此批次**：
              - 详情弹窗新增「一键重新自动排队」按钮，可将批次重置并立即交由本地 Worker 重新自动执行。
            - **数据库端拦截 Railway 抢任务**：
              - 数据库 RPC 严格拦截 `railway` 云端 Worker 认领查询批次，防止海外机房 IP 访问超时导致任务失败，100% 确保由本地住宅宽带 Worker 稳定执行。
          files: |
            build/app/outputs/flutter-apk/PassportMDAC-v1.0.6.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
