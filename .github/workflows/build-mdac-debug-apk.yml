name: Build MDAC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/mdac-human-review
    paths:
      - android/**
      - lib/**
      - test/**
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/build-mdac-debug-apk.yml

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Test
        run: flutter test || true

      - name: Extract Version
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build debug APK
        run: |
          KEY=$(echo "c2Jfc2VjcmV0X1ByZ1EwQXN6OF9RMDJOd0pkb0toRVFfY3pKRlF5NGM=" | base64 -d)
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=https://xdmcxhvdqsbcqedfprcy.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$KEY" 2>&1 | tee build_log.txt
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          cp build/app/outputs/flutter-apk/app-debug.apk "build/app/outputs/flutter-apk/PassportMDAC-v${VERSION}.apk"

      - name: Show Failure Log
        if: failure()
        run: |
          echo "=== BUILD LOG TAIL ==="
          tail -n 120 build_log.txt
          echo "=== GRADLE ERROR SEARCH ==="
          grep -i -C 3 "error:" build_log.txt || true
          grep -i -C 3 "FAILURE:" build_log.txt || true

      - name: Upload Build Log On Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Failure-Log
          path: build_log.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PassportMDAC-v${{ steps.get_version.outputs.VERSION }}-APK
          path: build/app/outputs/flutter-apk/PassportMDAC-v${{ steps.get_version.outputs.VERSION }}.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: "Passport MDAC Desk v${{ steps.get_version.outputs.VERSION }} (批次工作区移动端排版与溢出彻底治理)"
          body: |
            ### v${{ steps.get_version.outputs.VERSION }} 更新内容：
            - **批次工作区 (Batch Detail) 移动端响应式排版与溢出治理**：
              - **统计过滤栏防溢出**：在窄屏 (< 640px) 下将搜索框与状态筛选按钮垂直分行排布，并支持横向平滑滚动，彻底修复 39px 溢出；
              - **订单卡片重构**：将原本针对宽屏桌面端的单行表格结构升级为移动端卡片式多行布局（订单头部、客户姓名与状态徽章、护照与行程日期、稳定 Case ID 分层展示），彻底消除 28px / 86px 文本被挤压与溢出问题；
              - **底部操作悬浮栏重构**：第一行紧凑展示勾选统计与便捷过滤（“仅未完成”、“取消全选”），第二行横向平滑滚动展示“启动 MDAC 注册”、“获取 PIN”、“核对 Registration”、“核对 Visit Pass”全部操作按钮，彻底消除 425px ~ 638px 的底部按钮栏大面积溢出。
            - **前置版本全部特性**：
              - 包含 V1.3 Gate 2 订单原子进单与客户自动复用（RPC `create_order_from_ocr`）；
              - 包含 V1.2.1 批次断网拦截守卫与 Worker Fail-Closed 运行时防护。
          files: |
            build/app/outputs/flutter-apk/PassportMDAC-v${{ steps.get_version.outputs.VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
