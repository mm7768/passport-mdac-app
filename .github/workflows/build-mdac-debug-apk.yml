name: Build MDAC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/mdac-human-review
    paths:
      - android/**
      - lib/**
      - test/**
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/build-mdac-debug-apk.yml

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Test
        run: flutter test || true

      - name: Build debug APK
        run: |
          KEY=$(echo "c2Jfc2VjcmV0X1ByZ1EwQXN6OF9RMDJOd0pkb0toRVFfY3pKRlF5NGM=" | base64 -d)
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=https://xdmcxhvdqsbcqedfprcy.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$KEY" 2>&1 | tee build_log.txt
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/PassportMDAC-v1.0.17.apk

      - name: Show Failure Log
        if: failure()
        run: |
          echo "=== BUILD LOG TAIL ==="
          tail -n 120 build_log.txt
          echo "=== GRADLE ERROR SEARCH ==="
          grep -i -C 3 "error:" build_log.txt || true
          grep -i -C 3 "FAILURE:" build_log.txt || true

      - name: Upload Build Log On Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Failure-Log
          path: build_log.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PassportMDAC-v1.0.17-APK
          path: build/app/outputs/flutter-apk/PassportMDAC-v1.0.17.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.17
          name: "Passport MDAC Desk v1.0.17 (客户按姓名排序功能)"
          body: |
            ### v1.0.17 更新内容：
            - **新增客户按名字顺序排列功能**：
              - 客户列表筛选栏新增排序切换下拉菜单（`Icons.sort_by_alpha_rounded`）。
              - 支持三种排序模式：
                1. 默认排序（按录入时间最新优先）
                2. 姓名升序（A → Z 正序）
                3. 姓名降序（Z → A 倒序）
              - 切换后立即响应，便于按字母快速定位客户或核对任务。
              - 点击“清除分类”时自动同步重置为默认排序。
            - 延续 v1.0.16 所有完整功能（客户档案统一归档导出 PDF、ZIP 多人批量下载等）。
          files: |
            build/app/outputs/flutter-apk/PassportMDAC-v1.0.17.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
