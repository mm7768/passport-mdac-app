name: Build MDAC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/mdac-human-review
      - v1.0.39-history
    paths:
      - android/**
      - lib/**
      - test/**
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/build-mdac-debug-apk.yml

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Extract Version
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build debug APK
        run: |
          KEY=$(echo "c2Jfc2VjcmV0X1ByZ1EwQXN6OF9RMDJOd0pkb0toRVFfY3pKRlF5NGM=" | base64 -d)
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=https://xdmcxhvdqsbcqedfprcy.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$KEY" 2>&1 | tee build_log.txt
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          cp build/app/outputs/flutter-apk/app-debug.apk "build/app/outputs/flutter-apk/PassportMDAC-v${VERSION}.apk"

      - name: Show Failure Log
        if: failure()
        run: |
          echo "=== BUILD LOG TAIL ==="
          tail -n 120 build_log.txt 2>/dev/null || true
          echo "=== GRADLE ERROR SEARCH ==="
          grep -i -C 3 "error:" build_log.txt 2>/dev/null || true
          grep -i -C 3 "FAILURE:" build_log.txt 2>/dev/null || true

      - name: Upload Build Log On Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Failure-Log
          path: build_log.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PassportMDAC-v${{ steps.get_version.outputs.VERSION }}-APK
          path: build/app/outputs/flutter-apk/PassportMDAC-v${{ steps.get_version.outputs.VERSION }}.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1.0.39-history'
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: "Passport MDAC Desk v${{ steps.get_version.outputs.VERSION }} (历史 Gmail 与 App Password 记忆切换增强版)"
          body: |
            ### v${{ steps.get_version.outputs.VERSION }} 更新内容：
            - **基于 v1.0.39 完整业务底座**：保留客户列表全部原有快捷按钮（MDAC 注册、获取 PIN、核对 Registration、核对 Visit Pass）及交互逻辑；
            - **MDAC 默认业务配置**：联系邮箱支持保存使用过的历史 Gmail，支持下拉列表选择及快捷芯片点选，直接切换免去重复输入；
            - **Gmail PIN 默认邮箱设置**：全面支持保存历史使用过的 Gmail 账号及对应的 Gmail App Passwords！切换历史账号时一键带入邮箱与应用密码，彻底省去查找复制密码的麻烦。
          files: |
            build/app/outputs/flutter-apk/PassportMDAC-v${{ steps.get_version.outputs.VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
