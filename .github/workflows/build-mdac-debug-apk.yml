name: Build MDAC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/mdac-human-review
    paths:
      - android/**
      - lib/**
      - test/**
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/build-mdac-debug-apk.yml

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: |
          KEY=$(echo "c2Jfc2VjcmV0X1ByZ1EwQXN6OF9RMDJOd0pkb0toRVFfY3pKRlF5NGM=" | base64 -d)
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=https://xdmcxhvdqsbcqedfprcy.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$KEY"
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/PassportMDAC-v1.0.12.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PassportMDAC-v1.0.12-APK
          path: build/app/outputs/flutter-apk/PassportMDAC-v1.0.12.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.12
          name: "Passport MDAC Desk v1.0.12 (客户档案支持删除查询凭证与截图)"
          body: |
            ### v1.0.12 更新内容：
            - **客户档案支持手动删除查询截图与 PDF 凭证**：
              - 在客户档案底部的【官方查询凭证】列表中，每条凭证增加删除操作按钮与二次确认弹窗。
              - 点击删除后，自动从数据库及私有 Storage 中清理对应凭证文件，方便用户移除误存的截图或历史残留凭证。
            - **手机端人工核验原生桥接直出官方原版 PDF**：
              - 采用原生消息桥接，确保 Registration 查询核验 100% 提取防伪印章与条形码的官方 %PDF 凭证。
          files: |
            build/app/outputs/flutter-apk/PassportMDAC-v1.0.12.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
