name: Build MDAC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/mdac-human-review
    paths:
      - android/**
      - lib/**
      - test/**
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/build-mdac-debug-apk.yml

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Test
        run: flutter test || true

      - name: Build debug APK
        run: |
          KEY=$(echo "c2Jfc2VjcmV0X1ByZ1EwQXN6OF9RMDJOd0pkb0toRVFfY3pKRlF5NGM=" | base64 -d)
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=https://xdmcxhvdqsbcqedfprcy.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$KEY" 2>&1 | tee build_log.txt
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/PassportMDAC-v1.0.28.apk

      - name: Show Failure Log
        if: failure()
        run: |
          echo "=== BUILD LOG TAIL ==="
          tail -n 120 build_log.txt
          echo "=== GRADLE ERROR SEARCH ==="
          grep -i -C 3 "error:" build_log.txt || true
          grep -i -C 3 "FAILURE:" build_log.txt || true

      - name: Upload Build Log On Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Failure-Log
          path: build_log.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PassportMDAC-v1.0.28-APK
          path: build/app/outputs/flutter-apk/PassportMDAC-v1.0.28.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.28
          name: "Passport MDAC Desk v1.0.28 (修复 _dependents.isEmpty 断言及手势嵌套冲突)"
          body: |
            ### v1.0.28 更新内容：
            - **彻底修复 Android 端 `_dependents.isEmpty: is not true` 断言红屏异常**：
              - 解耦卡片头部事件监听机制，消除多层 `InkWell` 嵌套导致的手势竞技场与 Material 依赖回收冲突；
              - 点击卡片展开/收起、勾选批次全选框、点击「合并/拆分」以及重命名，均拥有独立事件响应，互不干扰；
              - 为每个批次分类卡片赋予唯一 `ValueKey(group.id)`，消除动态批次合并/拆分时的 Widget 元素复用冲突；
              - 优化合并与拆分弹窗标题布局，移除无边界限制下的 `Expanded` 组件。
          files: |
            build/app/outputs/flutter-apk/PassportMDAC-v1.0.28.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

