name: Build MDAC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/mdac-human-review
    paths:
      - android/**
      - lib/**
      - test/**
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/build-mdac-debug-apk.yml

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Test
        run: flutter test || true

      - name: Build debug APK
        run: |
          KEY=$(echo "c2Jfc2VjcmV0X1ByZ1EwQXN6OF9RMDJOd0pkb0toRVFfY3pKRlF5NGM=" | base64 -d)
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=https://xdmcxhvdqsbcqedfprcy.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$KEY" 2>&1 | tee build_log.txt
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/PassportMDAC-v1.0.22.apk

      - name: Show Failure Log
        if: failure()
        run: |
          echo "=== BUILD LOG TAIL ==="
          tail -n 120 build_log.txt
          echo "=== GRADLE ERROR SEARCH ==="
          grep -i -C 3 "error:" build_log.txt || true
          grep -i -C 3 "FAILURE:" build_log.txt || true

      - name: Upload Build Log On Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Failure-Log
          path: build_log.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PassportMDAC-v1.0.22-APK
          path: build/app/outputs/flutter-apk/PassportMDAC-v1.0.22.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.22
          name: "Passport MDAC Desk v1.0.22 (Visit Pass 全景高清截图 & 彻底清理重复凭证)"
          body: |
            ### v1.0.22 更新内容：
            - **Visit Pass 全景紧凑高清截图**：自动隐藏滑块多余占位，紧凑拼接查询条件与结果表格，动态拉伸视口截取整张结果表格（含完整入境与到期日信息），彻底告别截断。
            - **客户档案旧凭证彻底清理与去重**：Worker 查到有效新记录后物理删除旧凭证行与 Storage 图片，前端仅展示最新单条有效凭证，彻底解决档案中同时显示“有效记录”与“未找到记录”两张截图的问题。
            - **脏数据自动清洗与一键重启脚本**：纠正误判客户状态，清理历史重复记录，并提供桌面一键重启 Worker 脚本。
          files: |
            build/app/outputs/flutter-apk/PassportMDAC-v1.0.22.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

