name: Build MDAC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/mdac-human-review
    paths:
      - android/**
      - lib/**
      - test/**
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/build-mdac-debug-apk.yml

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Test
        run: flutter test || true

      - name: Build debug APK
        run: |
          KEY=$(echo "c2Jfc2VjcmV0X1ByZ1EwQXN6OF9RMDJOd0pkb0toRVFfY3pKRlF5NGM=" | base64 -d)
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=https://xdmcxhvdqsbcqedfprcy.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$KEY" 2>&1 | tee build_log.txt
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/PassportMDAC-v1.0.31.apk

      - name: Show Failure Log
        if: failure()
        run: |
          echo "=== BUILD LOG TAIL ==="
          tail -n 120 build_log.txt
          echo "=== GRADLE ERROR SEARCH ==="
          grep -i -C 3 "error:" build_log.txt || true
          grep -i -C 3 "FAILURE:" build_log.txt || true

      - name: Upload Build Log On Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Failure-Log
          path: build_log.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PassportMDAC-v1.0.31-APK
          path: build/app/outputs/flutter-apk/PassportMDAC-v1.0.31.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.31
          name: "Passport MDAC Desk v1.0.31 (修复自动化任务同步400错误：仅同步最新Batch与历史按需加载)"
          body: |
            ### v1.0.31 更新内容：
            - **彻底修复任务同步 400 Bad Request**：
              - 默认仅同步各模块（MDAC注册/Gmail PIN/注册校验/通行证检查）最新一次批次任务，不再一次性请求全部历史任务；
              - 针对结果关联表（mdac_registrations、email_pin_records、registration_checks、visit_pass_checks）按当前模块精准查询；
              - 增加防守型分块过滤机制 (`chunkSize: 50`)，彻底杜绝 GET URL 超出服务器上限引发的 400 报错；
            - **新增“最新任务 / 历史任务”按需分段切换与详情懒加载**：
              - 3秒轮询仅对“最新任务”生效，历史任务在进入时按需分页加载（20条/页）；
              - 点击历史任务弹窗查看时按需拉取单批次完整子项与结果，极大提升 App 响应速度与流畅度。
          files: |
            build/app/outputs/flutter-apk/PassportMDAC-v1.0.31.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
