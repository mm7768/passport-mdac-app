name: Build MDAC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/mdac-human-review
    paths:
      - android/**
      - lib/**
      - test/**
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/build-mdac-debug-apk.yml

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze || true

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: |
          KEY=$(echo "c2Jfc2VjcmV0X1ByZ1EwQXN6OF9RMDJOd0pkb0toRVFfY3pKRlF5NGM=" | base64 -d)
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=https://xdmcxhvdqsbcqedfprcy.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$KEY"
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/PassportMDAC-v1.0.15.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PassportMDAC-v1.0.15-APK
          path: build/app/outputs/flutter-apk/PassportMDAC-v1.0.15.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.15
          name: "Passport MDAC Desk v1.0.15 (重试失败项、等待35秒防白屏与明确超时识别)"
          body: |
            ### v1.0.15 更新内容：
            - **支持仅重试失败项**：
              - 任务卡片与详情弹窗中新增“重试失败项”按钮，仅将失败/待核验客户重新排队，保留已成功客户。
            - **官方查询延长等待至 35 秒**：
              - 解决官方查询慢导致的空白/无记录假象。
            - **彻底消除半透明遮罩与白屏截图**：
              - 截图前自动注入 DOM 清理脚本，移除 blockUI、loading 遮罩，强制页面透明度为 1.0，确保截图清晰可见。
            - **严格区分真正无记录与查询超时**：
              - 仅当官方明确返回红字横幅或旧表格时才判为未找到符合记录；超时未响应则标为超时待核验，绝不乱下结论。
          files: |
            build/app/outputs/flutter-apk/PassportMDAC-v1.0.15.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
