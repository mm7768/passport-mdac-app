name: Build MDAC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/mdac-human-review
    paths:
      - android/**
      - lib/**
      - test/**
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/build-mdac-debug-apk.yml

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: |
          KEY=$(echo "c2Jfc2VjcmV0X1ByZ1EwQXN6OF9RMDJOd0pkb0toRVFfY3pKRlF5NGM=" | base64 -d)
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=https://xdmcxhvdqsbcqedfprcy.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$KEY"
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/PassportMDAC-v1.0.4.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PassportMDAC-v1.0.4-APK
          path: build/app/outputs/flutter-apk/PassportMDAC-v1.0.4.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.4
          name: "Passport MDAC Desk v1.0.4 (导出已获取 PIN 客户 Excel/CSV/剪贴板 · 移动端一键全选 · 修复 Android 文件保存)"
          body: |
            ### v1.0.4 更新内容：
            - **导出已获取 PIN 客户清单**：
              - 严格按 5 列标准输出：`A:名字`、`B:护照号`、`C:pin`、`D:注册使用的gmail`、`E:注册使用的手机号码`。
              - 支持直接保存为标准 Excel（`.xls`）、带 BOM UTF-8 CSV（`.csv`），以及一键复制为制表符表格直接粘贴。
              - 仅限已获取 PIN 的客户导出；混合多选时自动过滤并提示排除无 PIN 客户。
            - **移动端一键全选与快捷筛选**：
              - 新增「只看已获取 PIN」筛选标签。
              - 修复手机屏幕下表头全选框被隐藏的问题，在卡片顶部与筛选栏均新增显式「全选 / 取消全选」控件。
            - **修复 Android 文件保存 PathNotFoundException 错误**：
              - 解决 Android SAF (Storage Access Framework) 返回虚拟路径导致的保存报错问题。
          files: |
            build/app/outputs/flutter-apk/PassportMDAC-v1.0.4.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
