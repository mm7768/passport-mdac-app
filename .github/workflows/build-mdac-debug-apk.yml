name: Build MDAC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/mdac-human-review
    paths:
      - android/**
      - lib/**
      - test/**
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/build-mdac-debug-apk.yml

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: |
          KEY=$(echo "c2Jfc2VjcmV0X1ByZ1EwQXN6OF9RMDJOd0pkb0toRVFfY3pKRlF5NGM=" | base64 -d)
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=https://xdmcxhvdqsbcqedfprcy.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$KEY"
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/PassportMDAC-v1.0.11.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PassportMDAC-v1.0.11-APK
          path: build/app/outputs/flutter-apk/PassportMDAC-v1.0.11.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.11
          name: "Passport MDAC Desk v1.0.11 (手机端人工核验原生桥接直出官方原版 PDF)"
          body: |
            ### v1.0.11 更新内容：
            - **原生桥接解决 PDF 异步提取问题**：
              - 使用 Flutter 与 Android WebView 专属的 JavaScriptChannel / addJavaScriptHandler 机制回传官方 PDF 字节。
              - 修复了 v1.0.10 在 Android WebView 同步 evaluateJavascript 遇到 Promise 提前返回导致降级截屏的缺陷。
              - 强制要求 Check Registration 必须上传官方 %PDF 凭证，彻底杜绝截屏误传。
          files: |
            build/app/outputs/flutter-apk/PassportMDAC-v1.0.11.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
