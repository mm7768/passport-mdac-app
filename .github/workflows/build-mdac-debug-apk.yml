name: Build MDAC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/mdac-human-review
    paths:
      - android/**
      - lib/**
      - test/**
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/build-mdac-debug-apk.yml

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Test
        run: flutter test || true

      - name: Build debug APK
        run: |
          KEY=$(echo "c2Jfc2VjcmV0X1ByZ1EwQXN6OF9RMDJOd0pkb0toRVFfY3pKRlF5NGM=" | base64 -d)
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=https://xdmcxhvdqsbcqedfprcy.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$KEY" 2>&1 | tee build_log.txt
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/PassportMDAC-v1.0.21.apk

      - name: Show Failure Log
        if: failure()
        run: |
          echo "=== BUILD LOG TAIL ==="
          tail -n 120 build_log.txt
          echo "=== GRADLE ERROR SEARCH ==="
          grep -i -C 3 "error:" build_log.txt || true
          grep -i -C 3 "FAILURE:" build_log.txt || true

      - name: Upload Build Log On Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Failure-Log
          path: build_log.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PassportMDAC-v1.0.21-APK
          path: build/app/outputs/flutter-apk/PassportMDAC-v1.0.21.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.21
          name: "Passport MDAC Desk v1.0.21 (任务队列自动轮询刷新 & 护照导入即时审核)"
          body: |
            ### v1.0.21 更新内容：
            - **任务队列进入时自动同步与实时轮询**：打开任务队列界面自动拉取 Supabase 最新批次状态，并以 3 秒间隔静默轮询后台执行进度，离开页面自动注销定时器，告别手动刷新。
            - **护照导入后即时 AI 解析与自动弹窗审核**：点击导入护照上传成功后，前端自动进入轻量等待并轮询识别结果（通常 2~4 秒），完成后自动秒级弹出《人工确认 OCR 结果》弹窗，无需刷新、无需重启应用。
            - **Visit Pass 严格按列解析与全景防截断截图**：修复 Worker 误将历史记录到期日当成入境日的漏洞，严格只比对第一列 Date 入境日期；并在截图前动态扩展视口高度，确保完整截取自表单至准证表格的全景图。
          files: |
            build/app/outputs/flutter-apk/PassportMDAC-v1.0.21.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

