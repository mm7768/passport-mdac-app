name: Build MDAC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/mdac-human-review
    paths:
      - android/**
      - lib/**
      - test/**
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/build-mdac-debug-apk.yml

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: |
          KEY=$(echo "c2Jfc2VjcmV0X1ByZ1EwQXN6OF9RMDJOd0pkb0toRVFfY3pKRlF5NGM=" | base64 -d)
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=https://xdmcxhvdqsbcqedfprcy.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$KEY"
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/PassportMDAC-v1.0.3.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PassportMDAC-v1.0.3-APK
          path: build/app/outputs/flutter-apk/PassportMDAC-v1.0.3.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.3
          name: "Passport MDAC Desk v1.0.3 (支持自定义地区代码 / 废弃OCR草稿 / 解除防重锁定 / 护照长效预览)"
          body: |
            ### 更新内容：
            - **MDAC 业务配置支持自定义地区代码**：地区代码支持编辑输入 1 至 4 位国家/地区区号（例如 60、86、65、852 等），不再定死固定为 60。
            - **支持废弃/删除 OCR 识别草稿**：在 OCR 待审核卡片及审核弹窗中新增「废弃草稿」按钮，可彻底移除重复或错误草稿，杜绝审核卡死。
            - **解除防重复上传锁定**：优化文件去重策略，允许用户重新导入已删除客户或已废弃草稿的护照文件。
            - **护照原图永久长效查看**：将客户档案中的护照图片签名链接有效期调整为永久长效（10年），直到客户档案被主动删除为止。
            - **批量 30 本 Gmail PIN 队列与云端自动化稳定性升级**：已上线 Gmail PIN 批量 30 本无阻塞租约与精确隔离机制。
          files: |
            build/app/outputs/flutter-apk/PassportMDAC-v1.0.3.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
