name: Build MDAC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/mdac-human-review
    paths:
      - android/**
      - lib/**
      - test/**
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/build-mdac-debug-apk.yml

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: |
          KEY=$(echo "c2Jfc2VjcmV0X1ByZ1EwQXN6OF9RMDJOd0pkb0toRVFfY3pKRlF5NGM=" | base64 -d)
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=https://xdmcxhvdqsbcqedfprcy.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$KEY"
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/PassportMDAC-v1.0.7.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PassportMDAC-v1.0.7-APK
          path: build/app/outputs/flutter-apk/PassportMDAC-v1.0.7.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.7
          name: "Passport MDAC Desk v1.0.7 (官方 MDAC Slip PDF 自动抓取 · 凭证直连查看与导出 · 成功状态全量透出)"
          body: |
            ### v1.0.7 更新内容：
            - **官方 MDAC Slip PDF 自动抓取与入库**：
              - Check Registration 查询成功后，自动根据客户入境/出境日期匹配官方行程记录，点击官方 PDF 图标自动下载官方 MDAC Slip 原生 PDF 文档。
              - 自动将官方 PDF 存入 Supabase 专用凭据存储，以 `application/pdf` 格式归档，告别全页截图。
            - **App 任务明细全面透出官方 PDF 预览与导出**：
              - 针对所有状态（包括 SUCCEEDED 成功项），在任务详情弹窗中全量透出「📄 查看官方 PDF」绿色按钮（或截图凭证的「🖼️ 查看截图」）。
              - 凭证预览页顶部提供「复制直链」功能，一键将带签名的私有安全凭据链接复制到剪贴板，方便在浏览器导出、打印或发送客户。
            - **更强的下载容错与日期对齐**：
              - 增强多行程匹配与脚本触发保障，下载超时或异常时自动降级截屏兜底，确保全流程无缝运作。
          files: |
            build/app/outputs/flutter-apk/PassportMDAC-v1.0.7.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
