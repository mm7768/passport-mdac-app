name: Build MDAC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/mdac-human-review
    paths:
      - android/**
      - lib/**
      - test/**
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/build-mdac-debug-apk.yml

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Test
        run: flutter test || true

      - name: Build debug APK
        run: |
          KEY=$(echo "c2Jfc2VjcmV0X1ByZ1EwQXN6OF9RMDJOd0pkb0toRVFfY3pKRlF5NGM=" | base64 -d)
          flutter build apk --debug -v \
            --dart-define=SUPABASE_URL=https://xdmcxhvdqsbcqedfprcy.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$KEY" 2>&1 | tee build_log.txt
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/PassportMDAC-v1.0.16.apk

      - name: Upload Build Log On Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Failure-Log
          path: build_log.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PassportMDAC-v1.0.16-APK
          path: build/app/outputs/flutter-apk/PassportMDAC-v1.0.16.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.16
          name: "Passport MDAC Desk v1.0.16 (客户档案打包归档PDF功能)"
          body: |
            ### v1.0.16 更新内容：
            - **新增客户档案打包归档功能**：
              - 针对所有流程完成（Visit Pass 已查 / Registration 已查）的客户，可一键导出专属归档 PDF。
              - 每个客户独立一份 PDF，严格命名为 `YYYYMMDD_客户姓名.pdf`。
              - PDF 页面组合：第 1 页为 Visit Pass 凭证截图，第 2 页为客户护照原件图，第 3 页起拼接官方 Registration PDF。
              - 列表勾选多人批量打包时，自动打包为一个 ZIP 压缩包下载；单人勾选或在档案详情中导出时直接保存为 PDF。
              - 客户业务状态筛选菜单新增“Registration 已查”和“Visit Pass 已查”快捷过滤。
          files: |
            build/app/outputs/flutter-apk/PassportMDAC-v1.0.16.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
