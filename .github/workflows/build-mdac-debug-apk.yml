name: Build MDAC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/mdac-human-review
    paths:
      - android/**
      - lib/**
      - test/**
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/build-mdac-debug-apk.yml

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Test
        run: flutter test || true

      - name: Build debug APK
        run: |
          KEY=$(echo "c2Jfc2VjcmV0X1ByZ1EwQXN6OF9RMDJOd0pkb0toRVFfY3pKRlF5NGM=" | base64 -d)
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=https://xdmcxhvdqsbcqedfprcy.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$KEY" 2>&1 | tee build_log.txt
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/PassportMDAC-v1.0.19.apk

      - name: Show Failure Log
        if: failure()
        run: |
          echo "=== BUILD LOG TAIL ==="
          tail -n 120 build_log.txt
          echo "=== GRADLE ERROR SEARCH ==="
          grep -i -C 3 "error:" build_log.txt || true
          grep -i -C 3 "FAILURE:" build_log.txt || true

      - name: Upload Build Log On Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Failure-Log
          path: build_log.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PassportMDAC-v1.0.19-APK
          path: build/app/outputs/flutter-apk/PassportMDAC-v1.0.19.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.19
          name: "Passport MDAC Desk v1.0.19 (弹窗溢出修复与凭证彻底删除)"
          body: |
            ### v1.0.19 更新内容：
            - **彻底修复弹窗溢出警告 (Yellow-Black Striped Warning)**：
              - 修复启动自动化查询弹窗标题溢出（RIGHT OVERFLOWED BY 55 PIXELS）。
              - 修复导出客户 PIN 清单弹窗标题溢出（RIGHT OVERFLOWED BY 102 PIXELS）及内容底部溢出（BOTTOM OVERFLOWED BY 23 PIXELS）。
              - 批量打包 PDF 弹窗增加自适应宽度与滚动支持，彻底杜绝所有移动端尺寸溢出报错。
            - **修复客户核验凭证 PDF / 截图删除与云端同步**：
              - 增加数据库级安全删除策略与 `delete_customer_human_evidence` RPC，彻底解决删除凭证后前端仍显示未删除条目的问题。
              - 删除凭证时同步清理云端存储文件与数据库记录，客户档案即时响应刷新。
              - FAN YAYUAN 客户档案已清理冗余旧 PDF 凭证。
          files: |
            build/app/outputs/flutter-apk/PassportMDAC-v1.0.19.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
