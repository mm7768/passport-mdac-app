name: Build MDAC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/mdac-human-review
    paths:
      - android/**
      - lib/**
      - test/**
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/build-mdac-debug-apk.yml

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: |
          KEY=$(echo "c2Jfc2VjcmV0X1ByZ1EwQXN6OF9RMDJOd0pkb0toRVFfY3pKRlF5NGM=" | base64 -d)
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=https://xdmcxhvdqsbcqedfprcy.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$KEY"
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/PassportMDAC-v1.0.13.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PassportMDAC-v1.0.13-APK
          path: build/app/outputs/flutter-apk/PassportMDAC-v1.0.13.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.13
          name: "Passport MDAC Desk v1.0.13 (Visit Pass 入境日期+2天范围校验与方案B精准截屏)"
          body: |
            ### v1.0.13 更新内容：
            - **Check Visit Pass 目标判定严格限定在登记入境日期当天及后延 2 天内**：
              - 目标匹配窗口严格锁定为 `[EntryDate, EntryDate + 1, EntryDate + 2]`（共3天）。
              - 官方页面中的历史移动记录或不在此窗口内的记录均不判定为成功 (`FOUND`)，手机端将提示日期不符，自动化 Worker 自动转人工复核 (`NEEDS_REVIEW`)。
            - **Visit Pass 方案 B 精准截图裁切**：
              - 手机端人工核对与后台 Worker 均实现精准截屏裁切：保留页面上方输入框与滑块区域，下方严格裁断至目标 Visit Pass 记录行，过滤多余空白与下方历史记录。
          files: |
            build/app/outputs/flutter-apk/PassportMDAC-v1.0.13.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
