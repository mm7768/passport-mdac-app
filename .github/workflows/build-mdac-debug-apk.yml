name: Build MDAC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/mdac-human-review
    paths:
      - android/**
      - lib/**
      - test/**
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/build-mdac-debug-apk.yml

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Test
        run: flutter test || true

      - name: Build debug APK
        run: |
          KEY=$(echo "c2Jfc2VjcmV0X1ByZ1EwQXN6OF9RMDJOd0pkb0toRVFfY3pKRlF5NGM=" | base64 -d)
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=https://xdmcxhvdqsbcqedfprcy.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$KEY" 2>&1 | tee build_log.txt
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/PassportMDAC-v1.0.20.apk

      - name: Show Failure Log
        if: failure()
        run: |
          echo "=== BUILD LOG TAIL ==="
          tail -n 120 build_log.txt
          echo "=== GRADLE ERROR SEARCH ==="
          grep -i -C 3 "error:" build_log.txt || true
          grep -i -C 3 "FAILURE:" build_log.txt || true

      - name: Upload Build Log On Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Failure-Log
          path: build_log.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PassportMDAC-v1.0.20-APK
          path: build/app/outputs/flutter-apk/PassportMDAC-v1.0.20.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.20
          name: "Passport MDAC Desk v1.0.20 (客户批次卡片、批次合并与自动回退)"
          body: |
            ### v1.0.20 更新内容：
            - **客户档案折叠展开卡片**：取消平铺与顶部状态筛选按钮，按 MDAC 实际注册时间批次（今日注册批次、昨日注册批次等）、未注册客户、已回退客户进行手风琴卡片化管理，默认全部收起，支持顶部一键展开/收起，搜索时自适应展开。
            - **卡片表头一键全选**：每个卡片表头自带复选框，可一键全选或取消全选该卡片内的所有客户。
            - **跨批次合并客户功能**：新增批次合并功能，可在卡片表头一键将整个批次合并入目标批次，或在底部多选栏将选定客户统一并入目标批次。
            - **回退客户状态时自动回退凭证与任务**：当客户业务状态回退到待处理时，系统联动自动回退并清理旧的 Check Registration PDF、Visit Pass 截图及进行中自动化任务。
            - **客户列表与详情页刷新按钮**：客户档案列表与任务列表统一采用图标刷新按钮，一键同步 Supabase 最新数据。
          files: |
            build/app/outputs/flutter-apk/PassportMDAC-v1.0.20.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
