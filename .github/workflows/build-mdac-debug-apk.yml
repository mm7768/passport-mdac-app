name: Build MDAC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/mdac-human-review
    paths:
      - android/**
      - lib/**
      - test/**
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/build-mdac-debug-apk.yml

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: |
          KEY=$(echo "c2Jfc2VjcmV0X1ByZ1EwQXN6OF9RMDJOd0pkb0toRVFfY3pKRlF5NGM=" | base64 -d)
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=https://xdmcxhvdqsbcqedfprcy.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$KEY"
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/PassportMDAC-v1.0.10.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PassportMDAC-v1.0.10-APK
          path: build/app/outputs/flutter-apk/PassportMDAC-v1.0.10.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.10
          name: "Passport MDAC Desk v1.0.10 (手机端人工核验直出官方 PDF · 修复闭环流转)"
          body: |
            ### v1.0.10 更新内容：
            - **手机端人工核验直接提取官方原版 PDF**：
              - 在手机人工核验界面完成滑块并点击【查到记录】时，App 自动通过当前验证会话直接提取官方原版 PDF 并上传。
              - 摆脱截图降级，手机端人工介入核验也能 100% 产出带有防伪印章和条码的官方原版 MDAC PDF。
            - **优化人工核验提示**：
              - 修复初始加载时的下载嗅探误报，消除误导性的红字提示。
            - **批量任务联动闭环**：
              - 手机端核验确认后，原任务批次自动标记为完成并同步更新统计。
          files: |
            build/app/outputs/flutter-apk/PassportMDAC-v1.0.10.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
