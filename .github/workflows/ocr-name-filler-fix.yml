name: OCR Passport MRZ Filler Cleanup

on:
  push:
    branches:
      - fix/ocr-passport-name-order

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Normalize MRZ filler in passport names
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('worker/azure_ocr_worker.py')
          text = path.read_text()
          old_first = '    first_name = _field_text(fields, "FirstName", "GivenName")\n'
          new_first = '    first_name = " ".join(_field_text(fields, "FirstName", "GivenName").replace("<", " ").split())\n'
          old_last = '    last_name = _field_text(fields, "LastName", "Surname")\n'
          new_last = '    last_name = " ".join(_field_text(fields, "LastName", "Surname").replace("<", " ").split())\n'
          if text.count(old_first) != 1 or text.count(old_last) != 1:
              raise SystemExit('expected OCR name anchors exactly once')
          path.write_text(text.replace(old_first, new_first, 1).replace(old_last, new_last, 1))
          PY

      - name: Install worker dependencies
        run: python -m pip install -r requirements-worker.txt

      - name: Run existing OCR worker tests
        working-directory: worker
        run: python -m unittest test_azure_ocr_worker.py

      - name: Verify trailing MRZ filler is removed
        working-directory: worker
        run: |
          python - <<'PY'
          from azure_ocr_worker import parse_azure_result
          raw = {"analyzeResult": {"documents": [{"docType": "passport", "fields": {"FirstName": {"valueString": "XISHUN<<<"}, "LastName": {"valueString": "LI<"}, "DocumentNumber": {"valueString": "TEST124"}, "DateOfBirth": {"valueDate": "1990-01-02"}, "DateOfExpiration": {"valueDate": "2030-01-02"}, "Nationality": {"valueCountryRegion": "CHN"}, "Sex": {"valueString": "M"}}}]}}
          extracted, _, status = parse_azure_result(raw)
          assert status == "READY_TO_CREATE", status
          assert extracted["full_name"] == "LI XISHUN", extracted["full_name"]
          PY

      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ocr-name-filler-fix.yml
          git add worker/azure_ocr_worker.py
          git diff --cached --check
          git commit -m "fix: strip MRZ filler from passport names"
          git push origin HEAD:fix/ocr-passport-name-order
