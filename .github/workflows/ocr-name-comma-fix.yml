name: OCR Passport Trailing Comma Cleanup

on:
  push:
    branches:
      - fix/ocr-passport-name-order

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Normalize trailing comma in passport names
        run: |
          python3 - <<'PY'
          from pathlib import Path

          worker = Path('worker/azure_ocr_worker.py')
          text = worker.read_text()
          old_first = '    first_name = " ".join(_field_text(fields, "FirstName", "GivenName").replace("<", " ").split())\n'
          new_first = '    first_name = " ".join(_field_text(fields, "FirstName", "GivenName").replace("<", " ").split()).strip(" ,，")\n'
          old_last = '    last_name = " ".join(_field_text(fields, "LastName", "Surname").replace("<", " ").split())\n'
          new_last = '    last_name = " ".join(_field_text(fields, "LastName", "Surname").replace("<", " ").split()).strip(" ,，")\n'
          if text.count(old_first) != 1 or text.count(old_last) != 1:
              raise SystemExit('expected normalized OCR name anchors exactly once')
          worker.write_text(text.replace(old_first, new_first, 1).replace(old_last, new_last, 1))

          test = Path('worker/test_azure_ocr_worker.py')
          text = test.read_text()
          old = '                            "FirstName": {"valueString": "XISHUN", "confidence": 0.99},\n'
          new = '                            "FirstName": {"valueString": "XISHUN,", "confidence": 0.99},\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected LI/XISHUN regression anchor once, found {text.count(old)}')
          test.write_text(text.replace(old, new, 1))
          PY

      - name: Install worker dependencies
        run: python -m pip install -r requirements-worker.txt

      - name: Run OCR worker tests
        working-directory: worker
        run: python -m unittest test_azure_ocr_worker.py

      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ocr-name-comma-fix.yml
          git add worker/azure_ocr_worker.py worker/test_azure_ocr_worker.py
          git diff --cached --check
          git commit -m "fix: strip trailing comma from passport OCR names"
          git push origin HEAD:fix/ocr-passport-name-order
